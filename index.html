<style>
  :root{
    --ink:#12211B; --sub:#5B6B62; --paper:#EDEFEA; --card:#FFFFFF;
    --line:#D5DBD4; --green:#00563A; --greenSoft:#E4EDE7;
    --marker:#F5559A; --markerSoft:#FCDCEA; --mute:#9AA39C;
    --fd:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --fb:"Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);
       font-size:16px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:760px;margin:0 auto}
  header{padding:24px 16px 12px}
  .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--green);font-weight:700;margin:0}
  h1{font-family:var(--fd);font-size:28px;font-weight:600;margin:4px 0 0;letter-spacing:.02em}
  .mk{background-image:linear-gradient(transparent 58%, var(--markerSoft) 58%);padding:0 1px}
  .lead{font-size:12px;color:var(--sub);margin:8px 0 0}
  nav{position:sticky;top:0;z-index:5;background:var(--paper);padding:0 12px}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .tab{font-size:13px;padding:8px 14px;border-radius:999px;white-space:nowrap;
       border:1px solid var(--line);color:var(--sub);background:transparent}
  .tab.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
  main{padding:0 16px 96px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .card.hot{border-color:var(--marker)}
  .row{display:flex;align-items:center;gap:8px}
  .between{display:flex;align-items:center;justify-content:space-between}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap}
  .b-exam{background:var(--markerSoft);color:#B4185C}
  .b-skip{background:#EAEDE9;color:var(--mute)}
  .b-lec{background:var(--greenSoft);color:var(--green)}
  .chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
  .chip.on{background:var(--greenSoft);border-color:var(--green);color:var(--green);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .btn{display:block;width:100%;padding:13px;border-radius:999px;font-size:14px;font-weight:700;
       background:var(--green);color:#fff;text-align:center}
  .btn.ghost{background:var(--card);color:var(--green);border:1px solid var(--green)}
  .btn.quiet{background:var(--card);color:var(--sub);border:1px solid var(--line);font-weight:500}
  .btn:disabled{background:var(--mute)}
  .big{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
       border-radius:16px;padding:16px;margin-bottom:12px}
  .big .n{font-size:11px;letter-spacing:.1em;color:var(--green);font-weight:700}
  .big .t{font-family:var(--fd);font-size:18px;font-weight:600;margin-top:2px}
  .big .d{font-size:12px;color:var(--sub);margin-top:4px}
  .st{margin-bottom:16px}
  .st .s{font-size:11px;letter-spacing:.1em;color:var(--green);font-weight:700}
  .st h2{font-family:var(--fd);font-size:20px;font-weight:600;margin:2px 0 0}
  .sm{font-size:13px}.xs{font-size:12px;color:var(--sub)}
  .bar{height:4px;border-radius:999px;background:var(--line);margin-bottom:16px;overflow:hidden}
  .bar > i{display:block;height:4px;background:var(--green)}
  .q-def{font-size:15px;line-height:1.8}
  .q-term{font-family:var(--fd);font-size:22px;font-weight:600;line-height:1.6}
  .ans{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);color:var(--green)}
  .note{font-size:12px;color:var(--sub);margin-top:8px}
  textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:16px;padding:12px;
           font-family:inherit;font-size:14px;line-height:1.8;color:var(--ink);background:var(--card);
           outline:none;resize:vertical}
  textarea:focus{border-color:var(--green)}
  .kw{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
      color:var(--mute);margin:0 4px 6px 0}
  .kw.hit{background:var(--greenSoft);border-color:var(--green);color:var(--green);font-weight:700}
  ol{padding-left:0;list-style:none;margin:0}
  ol li{display:flex;gap:8px;font-size:14px;line-height:1.8;margin-bottom:12px}
  ol li .num{color:var(--mute);min-width:24px}
  ul.pts{list-style:none;padding:0;margin:0}
  ul.pts li{display:flex;gap:8px;font-size:14px;line-height:1.8;margin-bottom:8px}
  .oh{font-size:13px;font-weight:700;color:var(--green);margin-top:14px}
  .oh:first-child{margin-top:0}
  .ob{font-size:14px;line-height:1.8;margin-top:2px}
  .flexrow{display:flex;gap:8px}
  .flexrow > *{flex:1}
  .grow0{flex:0 0 auto;padding-left:20px;padding-right:20px}
  .chk{display:flex;align-items:center;gap:8px;padding:6px 0;width:100%;text-align:left}
  .box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line);display:inline-flex;
       align-items:center;justify-content:center;color:#fff;font-size:11px;flex:0 0 auto}
  .box.on{background:var(--green);border-color:var(--green)}
  .acc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
  .acc > button{width:100%;text-align:left;padding:16px;display:flex;justify-content:space-between;align-items:center}
  .acc .body{padding:0 16px 16px}
  .timer{font-variant-numeric:tabular-nums;color:var(--green);font-weight:700}
  .foot{font-size:11px;color:var(--sub);line-height:1.8;margin-top:24px}
  .stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);margin:10px 0 8px}
  .stack > i{display:block;height:10px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:999px;flex:0 0 auto;display:inline-block}
  .d-ok{background:var(--green)}.d-ng{background:var(--marker)}.d-none{background:var(--line)}
  .trow{width:100%;text-align:left;display:flex;align-items:flex-start;gap:10px;padding:12px 14px;
        border-bottom:1px solid var(--line);background:var(--card)}
  .trow:last-child{border-bottom:none}
  .trow .tt{flex:1;font-size:14px;line-height:1.5}
  .trow .tl{font-size:11px;color:var(--mute);margin-top:2px}
  .trow .dot{margin-top:6px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
  .detail{padding:0 14px 14px;background:var(--card);border-bottom:1px solid var(--line)}
  .setrow{display:flex;gap:6px;margin-top:10px}
  .setrow button{flex:1;font-size:12px;padding:8px 0;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
  .setrow button.on{font-weight:700}

  // 第2回

  { id: 4, l: 2, t: "知識（Knowledge）", d: "「どのように？」に答える段階。例：高熱と赤い喉から風邪の可能性を導く。" },

  { id: 6, l: 2, t: "シャノン", d: "情報を「量」として捉えた人物。不確実性の減少としての情報、情報量（ビット）・確率がキーワード。", tag: "exam" },
  { id: 7, l: 2, t: "ウィーナー", d: "情報を「制御」として捉えた人物。サイバネティクス、フィードバックによるシステム安定化。" },
  { id: 8, l: 2, t: "ベイトソン", d: "情報を「関係」として捉えた人物。「違いを生む違い」、文脈・関係性・意味の成立。" },

  { id: 12, l: 2, t: "ブール代数の適用", d: "1937年の修士論文。論理の「真/偽」と回路の「ON/OFF」を結び付け、コンピュータを情報処理機械へ進化させた。" },

  { id: 32, l: 3, t: "「メディアはメッセージである」", d: "マクルーハンの言葉。内容（コンテンツ）だけでなく、メディアそのものの形式・性質が社会や人間の認知に影響を与えるという考え方。" },
  { id: 33, l: 3, t: "マクルーハン", d: "「メディアはメッセージである」と述べたメディア論の代表的人物。" },

  { id: 43, l: 3, t: "言語の使用", d: "より正確な伝達が可能になった段階。ただし記録がないため口伝による変容・改竄が生じる。" },
  { id: 44, l: 3, t: "文字の使用", d: "記録による劣化なし・長期伝達が可能になった段階。ただし複製が困難で情報の閉鎖性が高い。" },
  { id: 45, l: 3, t: "情報の大衆化", d: "情報が増える→利用者が増える→コンテンツが増える→さらに情報が増える、という循環が生じること。" },

  { id: 193, l: 3, t: "メディア進化の段階", d: "ノンバーバル→言語→文字→印刷の発明（不特定多数への発信・情報の大衆化が始まる）→電信・電話（遠隔地とのリアルタイム化で世界が狭くなる）→ラジオ・テレビ（直感的な情報伝達で社会的影響が拡大）→インターネット（あらゆるメディアを統合したメタメディア）→SNS・スマホ（個人が常時・双方向に発信）。" },

  { id: 195, l: 3, t: "グーテンベルク", d: "15世紀のドイツ人発明家。活版印刷技術を発明し、聖書の大量印刷・配布を可能にした。ルターの「95か条の論題」がドイツ語で印刷・配布され宗教改革がヨーロッパ全土に波及するなど、印刷が社会変革の引き金となる原型をつくった。" },

  { id: 46, l: 4, t: "流通チャネル", d: "原材料採取→原材料加工→生産者→一次卸→二次卸→小売→消費者、という商品が流れる経路。" },

  { id: 64, l: 4, t: "テール側が狙える商材の比較", d: "音楽は30万点・6大レーベルなのに対し、書籍は300万点・出版社多数。だから書籍の方がテールを狙いやすい。", tag: "exam" },
  { id: 65, l: 4, t: "デジタルデータ", d: "書籍と同様に在庫コストが低く、ロングテールの考え方が当てはまる商材。", tag: "exam" },
  { id: 66, l: 4, t: "ロングテールが生む3つの効果", d: "①新たな収益源の創出（Amazonでは売上の約1/3がテール側とも言われる）②多様な消費者ニーズへの対応③品揃えの豊富さ自体が価値となる競合との差別化。", tag: "exam" },
  { id: 67, l: 4, t: "ロングテールが成立する条件", d: "在庫コストが低いこと／検索・レコメンデーションでテール商品にたどり着けること／物理的な陳列スペースの制約がないこと。", tag: "exam" },
  { id: 68, l: 4, t: "レコメンデーションシステム", d: "購入・閲覧履歴から個人の趣向を推測し、商品を推奨する仕組み。" },
  { id: 69, l: 4, t: "協調フィルタリング", d: "同様の商品を選んだ他ユーザーの履歴も参照して推奨精度を上げる方式。" },
  { id: 70, l: 4, t: "立地の制約からの解放", d: "ECの特性のひとつ。実店舗と違い、立地による不利がない。" },
  { id: 71, l: 4, t: "Appleの戦略（iPod/iTunes）", d: "音源そのもので利益が出なくてもよい。端末を買ってもらうことで収益化する、コンテンツとハードの組み合わせ戦略。" },

  // 第5回：広告
  { id: 123, l: 5, t: "広告代理店", d: "広告主とメディアの間の仲介役。広告主からの報酬（企画料・制作料）、メディアからの取引手数料、制作進行費が主な収益源。" },
  { id: 124, l: 5, t: "取引手数料のマージン", d: "広告代理店がメディアから受け取る手数料。慣習的に15〜20%程度とされる。" },
  { id: 125, l: 5, t: "DMP（Data Management Platform）", d: "データを集約・管理する基盤。近年は広告代理店自体がこれを運用するようになった。" },
  { id: 126, l: 5, t: "成果報酬型（パフォーマンスベース）契約", d: "「枠の売買」からデータ分析・運用最適化へ移る中で増えた、成果に応じて支払う契約形態。" },
  { id: 127, l: 5, t: "日本の総広告費（2025年）", d: "8兆623億円、前年比105.1%。4年連続で過去最高、初の8兆円超。" },
  { id: 128, l: 5, t: "インターネット広告費（2025年）", d: "4兆459億円、前年比110.8%。初めて総広告費の50.2%となり過半数に到達した。" },
  { id: 129, l: 5, t: "動画広告（2025年）", d: "1兆275億円、前年比121.8%。初の1兆円突破。" },
  { id: 130, l: 5, t: "媒体別推移（2005→2025年）", d: "インターネットは3,777→40,459億円で約10.7倍。新聞は約70%減、雑誌は約77%減、テレビは微減で最も底堅い。" },
  { id: 131, l: 5, t: "マネタイズ（収益化）", d: "無料で集めた利用者やコンテンツを収益に変えること。初期インターネットは「自由な社会」の風潮で収益化に抵抗があったが、利用者増で善意の運営が難しくなり、広告がその手段として模索された。", tag: "exam", note: "メモに「☆収益化＝マネタイズ」とあり" },
  { id: 132, l: 5, t: "バナー広告の登場（1994年）", d: "HotWired（Wired誌のオンライン版）に14社のロゴを掲載したのが始まり。「協賛」の意味合いから始まった。" },
  { id: 133, l: 5, t: "最初のバナー広告のクリック率", d: "AT&Tのバナーは記録上で約44%。現在のバナー広告の平均CTRは0.05%以下。" },
  { id: 134, l: 5, t: "Yahoo!の登場", d: "1994年にデビッド・ファイロとジェリー・ヤンがウェブディレクトリを作成。1995年に起業し、広告料収入で事業が成立することを実証した。" },
  { id: 135, l: 5, t: "ポータルサイト化", d: "ライバルとの競争激化によりニュース・天気・メール・ショッピング等を統合し、「リーチ（到達）」を最大化する戦略。" },
  { id: 136, l: 5, t: "広告モデルの4世代", d: "①期間保証型 →②インプレッション保証型（CPM）→③クリック保証型（CPC）→④成果報酬型（CPA）と進化した。", tag: "exam" },
  { id: 137, l: 5, t: "期間保証型", d: "期間（1ヶ月で〇〇万円）で課金。効果に関係なく料金がかかり柔軟性が低い。" },
  { id: 138, l: 5, t: "インプレッション保証型（CPM）", d: "表示回数（1,000回あたり）で課金。表示≠サイト訪問である点が課題。" },
  { id: 139, l: 5, t: "クリック保証型（CPC）", d: "クリック数で課金。効果測定が可能になり、A/Bテストへつながった。" },
  { id: 140, l: 5, t: "成果報酬型（CPA）", d: "購入・登録等の成果で課金。広告主のリスクが最小で、アフィリエイトはここから派生した。" },
  { id: 141, l: 5, t: "DART", d: "DoubleClick社のアドサーバ技術。複数Webサイトを束ねて配信・管理・効果測定を一元化した。2007年にGoogleが約31億ドルで買収しGoogle Ad Managerの基盤に。" },
  { id: 142, l: 5, t: "プログラマティック広告", d: "RTB（Real-Time Bidding）によるリアルタイムオークションで、ミリ秒単位で広告配信が決まる仕組み。" },
  { id: 143, l: 5, t: "DSP（Demand Side Platform）", d: "広告主側の入札・出稿を管理するプラットフォーム。" },
  { id: 144, l: 5, t: "SSP（Supply Side Platform）", d: "メディア側の広告枠を管理するプラットフォーム。" },
  { id: 145, l: 5, t: "ネット広告と従来広告の違い", d: "対象はマスからターゲティング可能へ、効果測定は困難から直接計測可能（CTR・CVR・ROAS）へ、費用は高額から少額可能へ、掲載後の変更困難からリアルタイム調整可能へ、一方的から即時に反応取得へ、掲載スペースは物理的制約から理論上無制限へ。", tag: "exam" },
  { id: 146, l: 5, t: "広告費がネットに移行する最大の理由", d: "広告効果を定量的に測定・最適化できること。", tag: "exam" },
  { id: 147, l: 5, t: "ディレクトリ型検索エンジン", d: "Yahoo!が採用。スタッフが審査・分類するため質は高いが、扱える情報量に限界があった。" },
  { id: 148, l: 5, t: "ロボット型検索エンジン", d: "機械的に自動収集する方式。ただし順位を決める要素がないことが課題だった。" },
  { id: 149, l: 5, t: "PageRankアルゴリズム", d: "1998年、ラリー・ペイジとセルゲイ・ブリンが開発。「リンクされている数が多ければ重要」という仮説を実証し、リンクの数と質で検索順位を決めた。" },
  { id: 150, l: 5, t: "検索連動型広告（リスティング広告）", d: "GoTo.com（後のOverture）が考案しGoogleが改良・発展。キーワード関連のテキスト広告を検索結果のスポンサー欄に表示し、検索結果と区別することで信頼性を維持する。", tag: "exam", note: "メモ：スポンサーだよって表示して信頼をなくさない！" },
  { id: 151, l: 5, t: "掲載順位の決まり方", d: "掲載順位＝入札単価×品質スコア。単に高い入札が上位表示ではなく、広告の質やLP品質（ランディングページ品質）も評価対象になる。", tag: "exam", note: "メモ：入札して上から順に表示してもらう" },
  { id: 152, l: 5, t: "オーガニック順位別CTR（2026年）", d: "1位39.8%、2位18.7%、3位10.2%、5位5.1%、10位1.6%。検索結果1ページ目の上位に載ることが極めて重要。", tag: "exam", note: "メモ：1番上のリンクが1番クリックされやすい!!" },
  { id: 153, l: 5, t: "ビッグワード", d: "「旅行」のような語。検索回数は多いが高単価でCTRは低い。" },
  { id: 154, l: 5, t: "ロングテール（キーワード）", d: "「沖縄 家族旅行 7月 格安」のような複合語。安価で高効果、購買意欲が高い。" },
  { id: 155, l: 5, t: "SEO（Search Engine Optimization）", d: "自然検索の順位を上げるための最適化。パンダアップデート（2011〜低品質コンテンツ対策）、ペンギンアップデート（2012〜不正リンク対策）がある。" },
  { id: 156, l: 5, t: "SEM（Search Engine Marketing）", d: "SEO＋リスティング広告＋その他施策の総称。目標は単なる上位表示ではなくコンバージョン。" },
  { id: 157, l: 5, t: "ROAS（Return On Ad Spend）", d: "売上÷広告費。順位2位でCPCが半額なら、ROAS的には2位が有利な場合もある。" },
  { id: 158, l: 5, t: "広告指標の略語", d: "Imp＝インプレッション数（表示回数）、CTR＝クリック率、CVR＝コンバージョン率、CPC＝クリック単価。" },
  { id: 159, l: 5, t: "アフィリエイト", d: "「提携する」モデルで厳密には広告ではない。ブログ等の個人↔ASP↔企業の3者構造。2023年10月からステルスマーケティング規制でPR表記が義務化された。" },
  { id: 160, l: 5, t: "Alphabetの収益（2025年）", d: "売上約4,000億ドル、うち広告収入約2,950億ドル（約59%）。2015年Q3では97〜98%だったので多角化が進んだ。" },
  { id: 161, l: 5, t: "「広告一本足打法」からの脱却", d: "Googleが広告＋クラウド＋サブスクの複合企業へ移行したこと。YouTubeは広告＋サブスクで年間600億ドル超、Google Cloudも年間約600億ドル（+48%）。" },
  { id: 162, l: 5, t: "検索エンジン市場シェア（2026年）", d: "Googleが全デバイスで90.0%、Bingが4.3%。Googleは2022年の92.6%から微減、BingはAI統合（Copilot）で5年連続微増。" },
  { id: 163, l: 5, t: "文脈ターゲティング", d: "ページ内容に基づいて広告を出す手法。プライバシーに配慮できる。" },
  { id: 164, l: 5, t: "行動ターゲティング", d: "Cookieで操作履歴を追跡して広告を出す手法。" },
  { id: 165, l: 5, t: "パーソナライズド広告", d: "検索・Gmail・YouTube等を横断して配信する手法（Googleは2012年〜）。" },
  { id: 166, l: 5, t: "リターゲティング・類似オーディエンス・位置情報連動", d: "一度訪問したユーザーへの再表示、既存顧客と似た属性への配信、GPS・Wi-Fi基地局によるローカル広告。", tag: "skip", note: "この表の範囲は「しゃべってない」とメモあり" },
  { id: 167, l: 5, t: "サードパーティCookie規制", d: "Safariの ITP（2020）、FirefoxのETP、ChromeのPrivacy Sandbox、EU GDPR（2018）、日本の改正個人情報保護法（2022、Cookieを個人関連情報として規制）、米国CCPA/CPRA。", tag: "skip", note: "この表の範囲は「しゃべってない」とメモあり" },
  { id: 168, l: 5, t: "ファーストパーティデータ", d: "自社で収集したデータ。ポストCookie時代の中心的な手法。" },
  { id: 169, l: 5, t: "ポストCookie時代の手法", d: "①ファーストパーティデータの活用 ②コンテクスチュアル広告の復権（Cookie不要）③Google Privacy Sandbox（Topics API等）④データクリーンルーム。「個人追跡」から「プライバシー保護と効果の両立」へ転換中。" },
  { id: 170, l: 5, t: "CGM（Consumer Generated Media）", d: "消費者自身がコンテンツを生成するメディア。ブログ、SNS、クチコミサイト、Q&Aサイト、動画共有など。", tag: "exam", note: "メモに「☆おぼえてって言った（ほしい）」とあり" },
  { id: 171, l: 5, t: "UGC（User Generated Content）", d: "CGM上で生み出されるコンテンツそのもの。", tag: "exam", note: "メモに「☆おぼえてって言った（ほしい）」とあり" },
  { id: 172, l: 5, t: "クチコミの変化", d: "対面時代は伝播に時間がかかり数名〜10名、伝達ごとに情報が変化し経路も見えにくかった。ネット・SNSでは瞬時に数百万人規模へ、原文のまま拡散し、経路もトレース可能になった。" },
  { id: 173, l: 5, t: "GoogleのSNS対応の失敗", d: "2010年にネットトラフィックがFacebookに抜かれ、Google+やTwitter検索も停止。CGMのクチコミが検索できない問題を抱えた。" },
  { id: 174, l: 5, t: "Metaの収益（2025年）", d: "年間売上高約2,010億ドル（+22%）、うち広告収入は約1,950億ドルで売上の約97%。DAUは35.8億人。" },
  { id: 175, l: 5, t: "Metaの強み", d: "①AI広告最適化（Advantage+等）②多様なフォーマット（フィード・ストーリーズ・リール・メッセージ）③計測インフラ（コンバージョンAPI）。" },
  { id: 176, l: 5, t: "X（旧Twitter）の収益推移", d: "2022年44億ドル→2023年34億ドル（▲23%）→2024年26億ドル（▲24%）→2025年約29億ドル（+12%）。広告主離れとブランドセーフティ問題が課題。" },
  { id: 177, l: 5, t: "従来の検索とAI検索の違い", d: "従来はキーワード入力→リンク一覧→クリックでクエリは3〜5語。AI検索は自然言語で質問→AIが直接回答し、クエリは20語以上の会話型でクリックが不要なケースが多い。" },
  { id: 178, l: 5, t: "主要AI検索プラットフォーム（2026年）", d: "ChatGPT（週間8億人超のアクティブユーザー）、Google AI Overviews（月間20億人超、200以上の国・40言語）、Perplexity AI（高精度、研究・分析に強み）。" },
  { id: 179, l: 5, t: "ゼロクリック検索の脅威", d: "AI検索の約93%がWebサイトのクリックなしで終了。AI Overviews表示でトップページのCTRは58%低下し、AI回答からのリンククリック率は1%未満。従来のリスティング広告やSEOの効果が低下している。", tag: "exam" },
  { id: 180, l: 5, t: "AI検索の広告戦略（2026年）", d: "ChatGPTは無料/Goプランで広告を出すハイブリッド（CPM約60ドル）、Google AI ModeはAI回答の約25.5%に広告表示、Perplexityは2026年2月に広告を完全撤廃しサブスクのみに。最適な収益モデルはまだ定まっていない。" },
  { id: 181, l: 5, t: "GEO（Generative Engine Optimization）", d: "AI検索時代に、自社情報がAIの回答に引用されるための最適化。市場規模は2025年約8.5億ドル→2034年予測337億ドル（CAGR 50.5%）。", tag: "exam" },
  { id: 182, l: 5, t: "AIに引用されるためのポイント", d: "統計データ・引用を含むコンテンツは引用率30〜40%向上、2ヶ月以内に更新されたページは28%向上。ドメインの権威性が最大の予測因子。今後はSEOとGEOの両立が課題。" },
  { id: 183, l: 5, t: "ソーシャルグラフ（狭義）", d: "人間関係を総合的にまとめたデータ。携帯番号一覧、年賀状リスト、Facebookのつながりなど。信頼関係vs同好関係、リアルvsバーチャルの2軸で分類できる。" },
  { id: 184, l: 5, t: "ソーシャルグラフが求められる背景", d: "情報量過多（流通情報量は7年で1.55倍だが消費量はほぼ横ばい）と、従来広告の限界（自画自賛・芸能人起用・流行誘導を消費者が信用しなくなった）。" },
  { id: 185, l: 5, t: "狭義のソーシャルグラフの価値と限界", d: "友人のおすすめは信頼度が高く、近い人の実体験は説得力があり、近い属性の選択は参考になる。ただしつながりの範囲が小さく、これ以上のビジネス活用は難しいため広義のソーシャルグラフへ向かう。" },
  { id: 186, l: 5, t: "広義のソーシャルグラフ（6層構造）", d: "人間系データ（A人と人のつながり／B人を識別する情報／C個人属性）と行動履歴データ（D人と物のつながり／E人とコンテンツのつながり／F人・物・コンテンツの相関関係）。A〜F全てを含むと最広義。" },
  { id: 187, l: 5, t: "楽天モデルとAmazonモデル", d: "楽天はショッピングモール型で出店者と購入者のマッチング（(D)(E)中心）、Amazonはレコメンデーション型でパーソナライゼーションの先駆者（(D)(E)(F)を高度活用）。" },
  { id: 188, l: 5, t: "理想のソーシャルコマース", d: "ソーシャルグラフ×ECデータの統合（A〜F全データ）。パーソナライズ商品提案＋社会的証明（友人レビュー）＝需要拡大。" },
  { id: 189, l: 5, t: "リテールメディア", d: "Amazon・楽天・Walmart等のEC上の広告。日本でも物販系ECプラットフォーム広告費は2,444億円（前年比112.5%）。" },
  { id: 190, l: 5, t: "広告代理店の役割の変化", d: "メディアバイイング（枠売買）中心→データ分析・DMP運用、マス広告の制作→運用型広告の最適化（AI活用）、メディアプランニング→コンサルティング（DX支援）、さらにGEO対策・AI検索対応へ。プログラマティック取引の普及で人手を介さない自動売買が主流に。" },
  { id: 191, l: 5, t: "無料でサービスを使える理由", d: "「利用者データの活用」と「広告」の2つしかない。", tag: "exam" },

  // 第6回
  { id: 72, l: 6, t: "アテンション・エコノミー", d: "情報が無限・無料になった結果、最も希少な資源が人間の「関心（時間・認知）」へ移行した経済のあり方。" },
  { id: 73, l: 6, t: "「ボトルの首」のメタファー", d: "情報という水は無限に湧くが、人間というボトルの口（時間・認知の限界）は狭く、そこに入る量だけが価値を生むという説明。" },
  { id: 74, l: 6, t: "ハーバート・サイモン", d: "1969〜71年、情報過多社会において「注意」が貴重な資源になると予見した人物。" },
  { id: 75, l: 6, t: "マイケル・ゴールドハーバー", d: "1997年に「アテンション・エコノミー」という概念を命名した人物。" },
  { id: 76, l: 6, t: "ドゥームスクロール", d: "絶望的なニュースを読み続けてしまう行動。アテンション・エコノミーの負の側面のひとつ。" },
  { id: 77, l: 6, t: "AIDMA", d: "マス広告全盛期の消費行動モデル。企業の広告が起点で、検索はなく、構造は直線的。" },
  { id: 78, l: 6, t: "AISAS", d: "Web1.0/2.0期の消費行動モデル。企業の広告が起点だが検索が1回入り、構造は直線的。", tag: "exam", note: "第5回のメモに「覚えてって言ってた（AISAS・ULSSAS）」とあり" },
  { id: 79, l: 6, t: "ULSSAS", d: "SNS時代の消費行動モデル。ユーザーのUGCが起点で、検索は2回（SNS＋Web）、構造は循環（フライホイール）。", tag: "exam", note: "第5回のメモに「覚えてって言ってた（AISAS・ULSSAS）」とあり" },
  { id: 80, l: 6, t: "UGC（User Generated Content）", d: "友人やインフルエンサーによる「映え」投稿など、ユーザー自身が生み出すコンテンツ。" },
  { id: 81, l: 6, t: "フライホイール効果", d: "購買行動が新たなUGCを生み、それが次のアテンションを呼ぶ循環構造。" },
  { id: 82, l: 6, t: "デコンストラクション", d: "デジタル化によって既存のバリューチェーンを支えていた仕組みが溶け、産業構造が解体されること。" },
  { id: 83, l: 6, t: "エヴァンス＆ワースター", d: "デジタル化により「情報の豊富さ」と「到達度」のトレードオフが解消されたと指摘した論者。" },
  { id: 84, l: 6, t: "情報の糊", d: "既存のバリューチェーンを結びつけていた「編集権・配給網・広告枠」のこと。これが溶けて産業が解体した。" },
  { id: 85, l: 6, t: "砂時計型市場", d: "取引コストの低下により、小規模化（専業化）と巨大化（プラットフォーム独占）に二極化し、中間層が空洞化した市場。" },
  { id: 86, l: 6, t: "限界費用ゼロ", d: "デジタル化により追加生産コストがほぼゼロになること。フリーミアム成立の前提。" },
  { id: 87, l: 6, t: "フリーミアム", d: "基本無料でユーザーを増やし、一部の課金ユーザーが全体の収益を支えるモデル。追加ユーザーのコストがほぼゼロだから成立する。" },
  { id: 88, l: 6, t: "推し活市場／クリエイターエコノミー市場", d: "2025年予測でそれぞれ約3.5兆円／約2.1兆円に達する見込みとされる市場。" },
  { id: 89, l: 6, t: "直接課金による還元率の変化", d: "マスメディア時代はクリエイターの手取りが10〜20%程度だったのに対し、投げ銭・サブスクでは70〜90%が還元される。" },
  { id: 90, l: 6, t: "意味の消費", d: "ファンが「自分が支えている」と実感しながら対価を払う消費のあり方。" },
  { id: 91, l: 6, t: "監視資本主義", d: "ショシャナ・ズボフが指摘した、利用者の全行動データが予測商品として収奪・利用される構造。" },
  { id: 92, l: 6, t: "IP（知的財産）の再定義", d: "情報産業においては単なる権利ではなく、「ファン行動データを生成し続ける装置」として捉えられる。" },
  { id: 93, l: 6, t: "トランスメディア展開", d: "アニメ・ゲーム・SNSなど複数メディアに展開し、多角的なユーザーデータを収集してIPを進化させ続ける手法。" },
  { id: 94, l: 6, t: "Netflixのデータ戦略", d: "『House of Cards』に代表される、視聴完走率や監督・俳優の相関データを分析してヒット確率を高める後方垂直統合。" },
  { id: 95, l: 6, t: "ゼロクリック時代", d: "検索が「10件のリンクから選ぶ」から「AIが統合した回答を得る」へ変わり、従来のWebメディアが流入減に瀕している状況。" },
  { id: 96, l: 6, t: "創造の民主化", d: "AIが副操縦士となり、ゼロから作るスキルよりディレクション能力や編集・統合能力が重要になる変化。" },

  // 第7回：製造業・一次産業・金融の変革
  { id: 206, l: 7, t: "産業情報化の3つの普遍法則", d: "①デジタルツイン化（物理→情報：失敗を仮想空間で済ませる／シミュレーション可能性）②アルゴリズム集約（勘→形式知：コピーすれば全現場が賢くなる／情報財の非競合性）③継続的関係化（取引→関係：データが副産物でなく主産物に／フローからストックへ）。異なる産業でもこの3法則で情報化を読み解ける。" },
  { id: 207, l: 7, t: "情報化の発展段階モデル", d: "標準化→最適化→自律化→サービタイゼーション。3つの法則は独立ではなく相互に強化し合い、ある産業の情報化は段階的に深まっていく。" },
  { id: 208, l: 7, t: "スマートファクトリー（製造業の情報化）", d: "「機械化」から「情報の統合」へ。3つの目的は①生産性向上②品質・付加価値向上③柔軟性確保（多品種少量生産）。" },
  { id: 209, l: 7, t: "第4次産業革命（インダストリー4.0）", d: "ドイツの国家戦略で「つながる工場」がキーワード。機械同士・工場同士・企業間がネットワークで結ばれる。競争原理は第1〜3次の「規模の経済」から、第4次の「学習効果・ネットワーク効果（使うほど賢くなる）」へ。一度先行すると後発が追いつけない構造になる。" },
  { id: 210, l: 7, t: "サイバー・フィジカル・システム（CPS）", d: "物理世界をデジタル空間で再現し、リアルタイムで制御する仕組み。法則①デジタルツイン化の技術的中核。" },
  { id: 211, l: 7, t: "日本のカイゼンと出遅れ", d: "トヨタ生産方式・QCサークル・見える化など、日本製造業は「情報産業の素質」を持っていた。しかし紙ベースの情報化にとどまってソフトウェア化に進めず、データを自社内に抱えてエコシステムを作らなかったため出遅れた。" },
  { id: 212, l: 7, t: "製造業DXの3段階と事例", d: "標準化（マルハニチロ：情報の透明性確保）→最適化（味の素・三菱電機：仮想空間での検討）→自律化（ロッテ：AI予兆保全）。段階が上がるほど3法則が重なって現れる。" },
  { id: 213, l: 7, t: "デジタル・ツイン", d: "現実の工場を仮想空間に寸分違わず再現する技術。三菱電機の「e-F@ctory」は生産・物流・設計を仮想空間で最適化し、設計から立ち上げまでの期間を大幅短縮した。味の素はPLANTAXISで工場全体を1mm単位で3Dデータ化。" },
  { id: 214, l: 7, t: "製造業の情報化の本質", d: "不確実性の排除（「たぶん大丈夫」を「データによる確信」へ）／情報の非競合性の応用（1つの最適化を世界中の工場に同時適用）／データは「第2の資産」（設備以上にログが競争力を決める）。「産業の情報化」から「情報の産業化」へ（製造ノウハウを外販：KOMTRAX、PLANTAXIS等）。" },
  { id: 215, l: 7, t: "スマート農業", d: "「言葉にできない暗黙知」をセンサー（IoT）とAIで形式知化する取り組み。法則②アルゴリズム集約の典型応用。日本農業の課題（平均年齢68歳超・労働力不足・暗黙知の喪失・耕作放棄地増加）への対応。「最もアナログな産業」が「最もハイテクな産業」へ。" },
  { id: 216, l: 7, t: "スマート農業の事例", d: "AI高糖度トマト（茎の太さ・葉の色からAIが最適な水やりを判断）、キュウリ革命（反収44〜50トン・露地比で数倍）、レタス工場生産（面積あたり80倍・天候に左右されない）、ドローン農薬散布（AIが生育不良箇所をピンポイント特定）。" },
  { id: 217, l: 7, t: "データ・オーナーシップ問題", d: "農家が日々入力したデータの所有権は誰にあるかという問題。種苗会社・農機メーカー・プラットフォーマーがデータを独占すると「データ封建制」のリスク。政府は農業データ連携基盤（WAGRI）を整備中。" },
  { id: 218, l: 7, t: "エンベデッド・ファイナンス（組込型金融）", d: "非金融企業が自社サービス内に金融機能を組み込み、決済や融資が「体験の一部」として提供される仕組み。「金融を意識しない金融」へ。フィンテックが「金融を使いに行く」必要があったのに対し、金融と日常体験の分断を解消する。楽天グループが典型例。" },
  { id: 219, l: 7, t: "組込型金融の3プレイヤー", d: "Brand（顧客接点を持つ非金融企業／Apple・メルカリ）、Enabler（技術基盤の提供者／BaaS事業者）、License Holder（免許を持つ金融機関／銀行・カード会社）。事例：Apple Card/Pay Later、スターバックスアプリ、メルカリ（メルペイ）。" },
  { id: 220, l: 7, t: "オルタナティブデータ", d: "財務諸表ではない「代替的なデータ」を活用すること。衛星画像×株価予測（工場の駐車台数から業績を推測）、POS×日次物価指数（政府統計を待たず2日前の売上で物価変動把握）、SNS感情分析（数百万件の投稿から景気・人気を予測）。" },
  { id: 221, l: 7, t: "信用スコアリングの変革", d: "過去の年収だけでなく、日々の決済行動から「信頼」を数値化する。銀行が独占していた「信用評価」が複製可能・流通可能に（法則②アルゴリズム集約の金融版）。ブロックチェーン・スマートコントラクト・クラウドファンディングが新しい金融インフラ。" },
  { id: 222, l: 7, t: "サービタイゼーション", d: "製品を売ることから「成果（価値）」を売ることへの転換。顧客は「機械」ではなく「機械が生み出す結果」を購入する。モノのコモディティ化・製造コスト削減の限界・新興国との価格競争が背景。3法則がすべて揃って初めて成立する究極のビジネスモデル。" },
  { id: 223, l: 7, t: "サービス化の3階層", d: "基本サービス（製品供給・スペアパーツ販売）→中間サービス（保守点検・修理・トレーニング）→高度サービス（成果報酬型契約・可用性保証）。メリットは継続的収益源（ストック型）の構築・顧客との密接な関係と参入障壁・景気変動に強い安定経営。" },
  { id: 224, l: 7, t: "Power by the Hour", d: "ロールス・ロイスが1962年に始めた古典的サービタイゼーション事例。航空エンジンを売り切らず稼働時間ごとに課金。顧客はエンジン所有リスクから解放され、ロールス・ロイスは継続収益と稼働データを獲得。「モノ売り」常識を覆したが、当時は法則①②が未発達で、デジタル化で本格普及期へ。" },
  { id: 225, l: 7, t: "KOMTRAX（コマツ）", d: "2001年〜、建機にGPSと通信機能を標準装備し、位置・稼働時間・燃料残量を遠隔把握。稼働データを無償提供して顧客との継続接点を維持。スマートコンストラクションでは建設現場の全工程をデジタル化し、「穴を掘る機械」でなく「高精度な地形を創る成果」を売る建設DXプラットフォーマーへ。3法則すべてが◎の完成形。" },
  { id: 226, l: 7, t: "リアルタイム・エコノミー（RTE）", d: "経済的・行政的取引がデジタル上で瞬時に実行されるパラダイム。「バッチ処理」から「リアルタイム応答」へ（法則①デジタルツイン化の時間軸方向の徹底）。顧客の要求に即座に・正確に応答できるアジリティが、不確実性の高い時代の究極の差別化要因。" },
  { id: 227, l: 7, t: "ブルウィップ効果", d: "需要変動が川上に向かうほど増幅される現象。小売±5%→卸±15%→メーカー±30%→原材料±50%。RTEは需要変動の情報を川上から川下まで瞬時に同期し、この増幅を解消する。事例：イトーキ（ERP+SCMのリアルタイム統合で資金繰り予測30%削減）、トヨタのJIT、花王（需要予測で全国8万店舗へ直接配送）。" },
  { id: 228, l: 7, t: "価値の源泉の移動", d: "製造業のGDP貢献は減少しても付加価値は増加。付加価値の源泉が「モノ」から「データ・サービス」へ移り、日本主要メーカーでもサービス・データ由来比率が30〜50%へ。「製造業」「サービス業」「IT産業」の境界が溶ける。" },
  { id: 229, l: 7, t: "データ・ポータビリティ（持ち運び権）", d: "メーカーが収集したデータは「メーカーのもの」とされがちだが、データを生んだのはユーザー企業・農家・消費者。データ独占（ロックイン）による競争喪失を防ぐため、EU（GDPR）・日本（情報銀行構想・WAGRI）・米国（州ごとの個人情報保護法）が法整備を進める。" },

  // 第8回：情報業界（主にSI）
  { id: 230, l: 8, t: "SIer（System Integrator）", d: "顧客企業の業務システムを企画から運用まで一括で請け負う企業。コンピュータ・ネットワーク・ソフトウェアを連携・一体化（システムインテグレーション）して納入する。読み方は「エスアイヤー」または「シスアイ」。" },
  { id: 231, l: 8, t: "SIの工程（V字モデル）", d: "要件定義（何を作るか）→基本設計（全体の骨格）→詳細設計（プログラムの中身）→開発・実装（コーディング）→単体・結合・総合テスト（品質担保）→運用・保守（本番稼働後の面倒を見る）。目的は顧客企業のニーズを満たすシステム導入（利便性向上・効率化・新サービス創出）。" },
  { id: 232, l: 8, t: "日本の受託モデル", d: "本来は各企業の情報システム部門が担う業務だが、ITが専門でない会社では情報システム部門が最小限／無い。日本は外部のSIerに「丸投げ」する受託モデル、欧米は企業内IT部門の内製が主流。日本のIT人材の約7割がSIer側に偏在している。" },
  { id: 233, l: 8, t: "SIerの3分類", d: "メーカー系（製造メーカーから派生／日立・NEC・富士通／親会社ハードとの親和性・大規模インフラが強み、親会社ハード導入が前提）、ユーザー系（事業会社のIT部門から独立／NTTデータ・野村総合研究所・SCSK／業務知識が深く安定基盤）、独立系（親会社を持たず起業／TIS・富士ソフト／ハード・ソフトの制約なし・機動力）。" },
  { id: 234, l: 8, t: "ユーザー系SIerの成立過程", d: "当時の情報システム部門の仕事（目的設定→予算化→プログラム作成→テスト→運用）が大企業内で省力化・効率化に成功し、系列会社向けにも展開→別会社化→ユーザー系SIerへ。例：野村證券 電子計算部→野村電子計算センター→野村コンピュータシステム→野村総合研究所（現在は資本関係はあるが子会社ではない）。" },
  { id: 235, l: 8, t: "人月（にんげつ）", d: "「1人が1ヶ月働く量＝1人月」として価格を算出する、IT業界特有の伝統的な工数管理単位。パラドクス：効率化して短期間で終わらせると売上が下がる。契約形態は請負契約（成果物の完成義務・瑕疵担保責任／設計・開発）と準委任契約（作業の提供のみ・完成は保証しない／SES・客先常駐）。" },
  { id: 236, l: 8, t: "上流工程と下流工程", d: "上流工程（要件定義・基本設計／顧客との対話・業務理解・判断力が必要／単価が高い・付加価値大）と下流工程（実装・テスト／仕様通りに作る技術力／単価は低め・技術の基礎習得）。" },
  { id: 237, l: 8, t: "多重下請け構造（ITゼネコン）", d: "元請（プライムコントラクター）が受注した仕事を下請け・孫請けへ再委託。建設業に似ているため「ITゼネコン」と呼ばれる。生まれた理由は、大規模プロジェクトに必要な数千人のエンジニアを1社で抱えられない・繁閑に応じた外部リソースの柔軟調整・営業力はないが技術力ある中小の存在・多様な技術分野の分担。", tag: "exam" },
  { id: 238, l: 8, t: "多重下請けのデメリット", d: "中抜き構造（各階層で管理費が抜かれ、元請100万円→4次請けで40万円以下に）、責任の所在の曖昧化（情報伝達が伝言ゲームで仕様が歪み、トラブル時の責任特定困難）、品質低下（納期遅延・再作業）。公正取引委員会の下請法違反取り締まり強化、大手SIerの直接雇用・パートナー化、アジャイル普及で限界が露呈。" },
  { id: 239, l: 8, t: "ITコンサルタント", d: "SIerのさらに上流工程で「なぜ作るか」「何を作るか」を検討する。経営課題を特定しITを「手段」として解決策を提示、企業の「投資判断」を支援する。ITコンサル（上流）とSIer（中流〜下流）は優劣ではなく役割分担。" },
  { id: 240, l: 8, t: "ITコンサルとSIerの違い", d: "ITコンサルは企画・戦略策定（最上流）・Top-down（経営課題から逆算）・提案型・価値課金（高単価）・報酬対象は「気づき/決断」・提案責任。SIerは要件定義以降・Bottom-up（現場業務から積み上げ）・受託型・工数課金（人月）・報酬対象は「成果物」・完成責任。" },
  { id: 241, l: 8, t: "ITコンサルのスキル三本柱", d: "①論理的思考能力②業務・ドメイン知識③コミュニケーション・交渉力。技術（IT）だけでは業界特有の悩みが解けない。例：銀行系コンサルには勘定系と情報系の違い・金融庁の規制（FISC・Basel III）・商習慣（月末締め・翌月払い等）の知識が必要。" },
  { id: 242, l: 8, t: "ITコンサル業界のプレイヤー", d: "戦略系（マッキンゼー・BCG）、総合系・外資（アクセンチュア・Big4）、総合系・日系（NRI・アビーム・日立コンサル）。外資はUp or Out・成果主義・グローバル標準の精緻な分析、日系は雇用が安定・伴走型・チームプレイと合意形成（根回し）重視。" },

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = (s) => (s||"").toLowerCase().replace(/[\s\u3000、。，．・「」『』（）()【】\-—ー]/g,"");
const shuffle = (arr) => { const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const badge = (tag) => tag==="exam" ? '<span class="badge b-exam">テスト出る</span>'
  : tag==="skip" ? '<span class="badge b-skip">覚えなくてよい</span>' : '';

const S = {
  view:"home", lec:"all", examOnly:false, includeSkip:false, dir:"d2t",
  deck:null, idx:0, opened:false, res:{},
  essay:null, essayText:"", essayChecked:false, essayOutline:false,
  mock:null, reveal:false, sec:0, running:false, timerId:null,
  sheetOpen:4, sFilter:"all", sLec:"all", openTerm:null, saveOK:true, weakOnly:false
};

/* 覚えた／あやしい の記録。ブラウザに保存され、次に開いても残る */
const KEY = "jsr-mastery-v1";
let MASTERY = {};
try { MASTERY = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }
catch(e){ MASTERY = {}; S.saveOK = false; }
function saveMastery(){
  try { localStorage.setItem(KEY, JSON.stringify(MASTERY)); }
  catch(e){ S.saveOK = false; }
}
const statusOf = (id) => MASTERY[id] || "none";
function counts(list){
  const c = {ok:0, ng:0, none:0};
  list.forEach(t => c[statusOf(t.id)]++);
  return c;
}

function pool(){
  return TERMS.filter(x=>{
    if(!S.includeSkip && x.tag==="skip") return false;
    if(S.examOnly && x.tag!=="exam") return false;
    if(S.lec!=="all" && x.l!==Number(S.lec)) return false;
    return true;
  });
}

/* 20問トレーニング用。「未定着だけ」がオンなら書けた語を外す */
function poolQuiz(){
  return S.weakOnly ? pool().filter(t => statusOf(t.id) !== "ok") : pool();
}

const TABS = [["home","ホーム"],["terms","大問1 用語"],["status","習得状況"],["essay","大問2-4 論述"],["mock","模擬テスト"],["sheet","要点シート"]];

/* ------------------------- views ------------------------- */
function vHome(){
  const examCount = TERMS.filter(t=>t.tag==="exam").length;
  let bars = "";
  for(let i=0;i<28;i++){ const h = 62/(1+i*0.72);
    bars += `<rect x="${8+i*10}" y="${70-h}" width="7" height="${h}" rx="1.5" fill="${i<4?'#00563A':'#FCDCEA'}"/>`; }
  return `
  <div class="card">
    <div class="between"><p class="sm" style="font-weight:700;margin:0">板書メモから：最優先はここ</p>${badge("exam")}</div>
    <svg viewBox="0 0 300 84" style="width:100%;height:84px;margin-top:12px">${bars}
      <line x1="48" y1="72" x2="290" y2="72" stroke="#F5559A" stroke-width="1.5"/>
      <text x="50" y="82" font-size="8" fill="#F5559A">長い尻尾（死に筋80%）＝ここを集積して収益化</text></svg>
    <p class="xs" style="margin:0">「Amazonとロングテール」のスライドに<b style="color:var(--ink)">テスト出る</b>と書き込みあり。用語${examCount}件と論述2問を「テスト出る」扱いで登録済み。</p>
  </div>

  <div class="card">
    <p class="sm" style="font-weight:700;margin:0 0 12px">出題範囲</p>
    <div class="chips" style="margin-bottom:12px">
      <button class="chip ${S.lec==='all'?'on':''}" data-act="lec" data-v="all">全範囲</button>
      ${Object.keys(LECTURES).map(k=>`<button class="chip ${S.lec===k?'on':''}" data-act="lec" data-v="${k}">第${k}回</button>`).join("")}
    </div>
    <button class="chk" data-act="toggle" data-v="examOnly">
      <span class="box ${S.examOnly?'on':''}">${S.examOnly?'✓':''}</span><span class="sm">「テスト出る」だけ出題する</span></button>
    <button class="chk" data-act="toggle" data-v="includeSkip">
      <span class="box ${S.includeSkip?'on':''}">${S.includeSkip?'✓':''}</span><span class="sm">「覚えなくてよい」も含める</span></button>
    <p class="xs" style="margin:12px 0 0">現在の出題対象：${pool().length}語</p>
  </div>

  ${(() => { const c = counts(TERMS), tot = TERMS.length;
    return `<div class="card">
      <div class="between"><p class="sm" style="font-weight:700;margin:0">覚えた用語</p>
        <span class="sm" style="font-weight:700;color:var(--green)">${c.ok} / ${tot}</span></div>
      <div class="stack">
        <i style="width:${c.ok/tot*100}%;background:var(--green)"></i>
        <i style="width:${c.ng/tot*100}%;background:var(--marker)"></i></div>
      <div class="legend"><span><i class="dot d-ok"></i>書けた ${c.ok}</span>
        <span><i class="dot d-ng"></i>あやしい ${c.ng}</span>
        <span><i class="dot d-none"></i>まだ ${c.none}</span></div>
    </div>`; })()}

  ${[["terms","大問1","用語20問トレーニング","説明を読んで用語を答える。20問1セットで自己採点。"],
     ["status","一覧","習得状況をみる","どれを覚えてどれが不安か、用語ごとに一覧で確認・修正できる。"],
     ["essay","大問2-4","論述トレーニング","予想問題に答案を書くと、必須キーワードが入っているか判定される。"],
     ["mock","本番形式","模擬テスト","用語20問＋論述3問を自動生成。時間を計って通しで解く。"],
     ["sheet","直前","要点シート","講義回ごとの要点を一覧で確認する。"]]
    .map(([v,n,t,d])=>`<button class="big" data-act="go" data-v="${v}">
      <span class="n">${n}</span><span class="t">${t}</span><span class="d">${d}</span></button>`).join("")}

  <p class="foot">収録：用語${TERMS.length}語／論述${ESSAYS.length}問（第2・3・4・6・7・8・14・15回）。第7・8回は資料が図中心のため収録が少なめ。<br>
  このページは1ファイルで完結しています。友だちに送れば同じように使えます。</p>`;
}

function vTerms(){
  const p = poolQuiz();
  if(!S.deck){
    return `<div class="st"><p class="s">大問1</p><h2>用語20問</h2></div>
    <div class="card">
      <p class="sm" style="font-weight:700;margin:0 0 8px">出題の向き</p>
      <div class="chips">
        <button class="chip ${S.dir==='d2t'?'on':''}" data-act="dir" data-v="d2t">説明 → 用語</button>
        <button class="chip ${S.dir==='t2d'?'on':''}" data-act="dir" data-v="t2d">用語 → 説明</button>
      </div>
      <button class="chk" style="margin-top:12px" data-act="toggle" data-v="weakOnly">
        <span class="box ${S.weakOnly?'on':''}">${S.weakOnly?'✓':''}</span>
        <span class="sm">「書けた」以外だけ出す</span></button>
      <p class="xs" style="margin:8px 0 0">出題対象は${p.length}語。ここから20問をランダムに出します（範囲はホームで変更）。</p>
      ${p.length===0?`<p class="xs" style="margin:8px 0 0;color:var(--marker)">条件に合う用語がありません。チェックを外すか、範囲を広げてください。</p>`:""}
    </div>
    <button class="btn" data-act="start" ${p.length?"":"disabled"}>20問はじめる</button>`;
  }
  if(S.idx >= S.deck.length){
    const ok = Object.values(S.res).filter(v=>v==="ok").length;
    const missed = S.deck.filter(c=>S.res[c.id]==="ng");
    return `<div class="st"><p class="s">結果</p><h2>${ok} / ${S.deck.length} 正解</h2></div>
    ${missed.length?`<div class="card"><p class="sm" style="font-weight:700;margin:0 0 8px">もう一度やる用語</p>
      ${missed.map(m=>`<div style="margin-bottom:10px"><span class="sm" style="font-weight:700">${esc(m.t)}</span>
      <span class="xs" style="margin-left:8px">第${m.l}回</span><p class="xs" style="margin:2px 0 0">${esc(m.d)}</p></div>`).join("")}
    </div>`:""}
    <div class="flexrow">
      <button class="btn" data-act="retry">${missed.length?"間違えた分だけ再挑戦":"もう一度20問"}</button>
      <button class="btn quiet grow0" data-act="reset">設定へ</button>
    </div>
    <button class="btn ghost" style="margin-top:8px" data-act="go" data-v="status">習得状況をみる</button>`;
  }
  const c = S.deck[S.idx];
  const front = S.dir==="d2t" ? c.d : c.t;
  const back  = S.dir==="d2t" ? c.t : c.d;
  const fc = S.dir==="d2t" ? "q-def" : "q-term";
  const bc = S.dir==="d2t" ? "q-term" : "q-def";
  return `
  <div class="between" style="margin-bottom:12px">
    ${S.idx>0 ? `<button class="xs" data-act="prev">← 前へ</button>` : `<span></span>`}
    <span class="xs">${S.idx+1} / ${S.deck.length}</span>
    <button class="xs" data-act="reset">やめる</button></div>
  <div class="bar"><i style="width:${(S.idx/S.deck.length)*100}%"></i></div>
  <div class="card" style="min-height:220px">
    <div class="row" style="margin-bottom:12px"><span class="badge b-lec">第${c.l}回</span>${badge(c.tag)}</div>
    <div class="${fc}">${esc(front)}</div>
    ${S.opened
      ? `<div class="ans"><div class="${bc}" style="color:var(--green)">${esc(back)}</div>
         ${c.note?`<p class="note">← ${esc(c.note)}</p>`:""}</div>`
      : `<button class="btn ghost" style="margin-top:20px" data-act="open">答えを見る</button>`}
  </div>
  ${S.opened?`<div class="flexrow" style="margin-top:16px">
    <button class="btn quiet" data-act="grade" data-v="ng">あやしい</button>
    <button class="btn" data-act="grade" data-v="ok">書けた</button></div>`:""}`;
}

function vEssay(){
  if(!S.essay){
    return `<div class="st"><p class="s">大問2・3・4</p><h2>論述の予想問題</h2></div>
    ${ESSAYS.map(e=>`<button class="big ${e.tag==="exam"?"hot":""}" data-act="essay" data-v="${e.id}">
      <span class="row" style="margin-bottom:6px"><span class="badge b-lec">第${e.l}回</span>${badge(e.tag)}</span>
      <span class="sm" style="display:block">${esc(e.q)}</span></button>`).join("")}`;
  }
  const e = S.essay;
  const n = norm(S.essayText);
  const hits = e.kw.map(alts => alts.some(a => n.includes(norm(a))));
  const hitCount = hits.filter(Boolean).length;
  return `
  <button class="xs" data-act="essayBack" style="margin-bottom:12px">← 問題一覧へ</button>
  <div class="card">
    <div class="row" style="margin-bottom:8px"><span class="badge b-lec">第${e.l}回</span>${badge(e.tag)}</div>
    <div style="font-family:var(--fd);font-size:17px;font-weight:600;line-height:1.7">${esc(e.q)}</div>
  </div>
  <p class="sm" style="font-weight:700;margin:0 0 8px">答案を書く</p>
  <textarea id="ta" placeholder="骨子だけでもOK。キーワードを入れて書いてみる。">${esc(S.essayText)}</textarea>
  <div class="between" style="margin:4px 0 12px">
    <span class="xs"><span id="cnt">${S.essayText.replace(/\s/g,"").length}</span> 字</span>
    <button class="chip on" data-act="check">キーワードを判定する</button>
  </div>
  ${S.essayChecked?`<div class="card">
    <p class="sm" style="font-weight:700;margin:0 0 8px">必須キーワード ${hitCount} / ${e.kw.length}</p>
    <div>${e.kw.map((alts,i)=>`<span class="kw ${hits[i]?'hit':''}">${hits[i]?'✓ ':''}${esc(alts[0])}</span>`).join("")}</div>
    <p class="xs" style="margin:8px 0 0">文字が一致しているかを見ているだけなので判定は目安。書けなかった語は骨子で確認する。</p>
  </div>`:""}
  <button class="btn ghost" style="margin-bottom:12px" data-act="outline">${S.essayOutline?"骨子を隠す":"解答の骨子を見る"}</button>
  ${S.essayOutline?`<div class="card">${e.outline.map(o=>`<p class="oh">${esc(o.h)}</p><p class="ob">${esc(o.b)}</p>`).join("")}</div>`:""}`;
}

function vMock(){
  if(!S.mock){
    return `<div class="st"><p class="s">本番形式</p><h2>模擬テスト</h2></div>
    <div class="card"><p class="sm" style="margin:0">大問1に用語20問、大問2・3・4に論述を1問ずつ出します。論述には「テスト出る」の問題を必ず1問含めます。</p>
    <p class="xs" style="margin:8px 0 0">紙かノートに手で書くのがおすすめ。経過時間だけ計測します。</p></div>
    <button class="btn" data-act="mockStart">模擬テストをはじめる</button>`;
  }
  const mm = String(Math.floor(S.sec/60)).padStart(2,"0"), ss = String(S.sec%60).padStart(2,"0");
  return `
  <div class="between" style="margin-bottom:12px">
    <span style="font-family:var(--fd);font-weight:600">模擬テスト</span>
    <span class="row"><span class="timer" id="timer">${mm}:${ss}</span>
      <button class="chip" data-act="pause">${S.running?"一時停止":"再開"}</button></span></div>
  <div class="card">
    <p style="font-family:var(--fd);font-weight:700;font-size:14px;margin:0 0 12px">大問1　次の説明にあてはまる用語を答えなさい。（20問）</p>
    <ol>${S.mock.terms.map((t,i)=>`<li><span class="num">${i+1}.</span><span>${esc(t.d)}
      ${S.reveal?`<b style="display:block;color:var(--green);margin-top:4px">→ ${esc(t.t)}</b>`:""}</span></li>`).join("")}</ol>
  </div>
  ${S.mock.essays.map((e,i)=>`<div class="card">
    <p style="font-family:var(--fd);font-weight:700;font-size:14px;margin:0 0 8px">大問${i+2}</p>
    <p class="sm" style="margin:0">${esc(e.q)}</p>
    ${S.reveal?`<div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)">
      ${e.outline.map(o=>`<p class="oh">${esc(o.h)}</p><p class="ob">${esc(o.b)}</p>`).join("")}</div>`:""}
  </div>`).join("")}
  <div class="flexrow" style="margin-top:16px">
    <button class="btn" data-act="reveal">${S.reveal?"解答を隠す":"解答・骨子を見る"}</button>
    <button class="btn quiet grow0" data-act="mockStart">作り直す</button></div>`;
}

function statusList(){
  return TERMS.filter(t=>{
    if(S.sLec!=="all" && t.l!==Number(S.sLec)) return false;
    if(S.sFilter!=="all" && statusOf(t.id)!==S.sFilter) return false;
    return true;
  });
}

function vStatus(){
  const all = counts(TERMS), tot = TERMS.length;
  const list = statusList();
  const weakN = TERMS.filter(t=>S.sLec==="all"||t.l===Number(S.sLec)).filter(t=>statusOf(t.id)!=="ok").length;
  const F = [["all","すべて",tot],["ok","書けた",all.ok],["ng","あやしい",all.ng],["none","まだ",all.none]];
  return `<div class="st"><p class="s">一覧</p><h2>習得状況</h2></div>

  <div class="card">
    <div class="between"><p class="sm" style="font-weight:700;margin:0">全体</p>
      <span class="sm" style="font-weight:700;color:var(--green)">${all.ok} / ${tot}</span></div>
    <div class="stack">
      <i style="width:${all.ok/tot*100}%;background:var(--green)"></i>
      <i style="width:${all.ng/tot*100}%;background:var(--marker)"></i></div>
    <div class="legend"><span><i class="dot d-ok"></i>書けた ${all.ok}</span>
      <span><i class="dot d-ng"></i>あやしい ${all.ng}</span>
      <span><i class="dot d-none"></i>まだ ${all.none}</span></div>
  </div>

  <div class="card">
    <p class="sm" style="font-weight:700;margin:0 0 12px">講義回ごと</p>
    ${Object.keys(LECTURES).map(k=>{ const ls = TERMS.filter(t=>t.l===Number(k)); const c = counts(ls);
      return `<div class="lecrow"><span class="nm">第${k}回</span>
        <span class="track"><i style="width:${c.ok/ls.length*100}%"></i></span>
        <span class="cnt">${c.ok}/${ls.length}</span></div>`; }).join("")}
  </div>

  <div class="chips" style="margin-bottom:8px">
    ${F.map(([k,l,n])=>`<button class="chip ${S.sFilter===k?'on':''}" data-act="sfilter" data-v="${k}">${l} ${n}</button>`).join("")}
  </div>
  <div class="chips" style="margin-bottom:12px">
    <button class="chip ${S.sLec==='all'?'on':''}" data-act="slec" data-v="all">全範囲</button>
    ${Object.keys(LECTURES).map(k=>`<button class="chip ${S.sLec===k?'on':''}" data-act="slec" data-v="${k}">第${k}回</button>`).join("")}
  </div>

  ${weakN ? `<button class="btn" style="margin-bottom:12px" data-act="weak">
    まだ／あやしい ${weakN}語から20問だす</button>` : ""}

  ${list.length ? list.map(t=>{ const st = statusOf(t.id); const open = S.openTerm===t.id;
    return `<div class="item">
      <button class="itemhead" data-act="term" data-v="${t.id}">
        <i class="dot d-${st}"></i>
        <span class="tn">${esc(t.t)}</span>
        ${t.tag==="exam"?'<span class="badge b-exam">出る</span>':''}
        <span class="lc">第${t.l}回</span>
      </button>
      ${open?`<div class="itembody">
        <p class="xs" style="margin:0 0 10px;color:var(--ink);line-height:1.8">${esc(t.d)}</p>
        ${t.note?`<p class="note" style="margin:0 0 10px">← ${esc(t.note)}</p>`:""}
        <div class="flexrow">
          <button class="mark ${st==='ok'?'ok':''}" data-act="mark" data-v="${t.id}:ok">書けた</button>
          <button class="mark ${st==='ng'?'ng':''}" data-act="mark" data-v="${t.id}:ng">あやしい</button>
          <button class="mark" data-act="mark" data-v="${t.id}:clear">未記録に戻す</button>
        </div></div>`:""}
    </div>`; }).join("")
    : `<p class="xs" style="text-align:center;padding:24px 0">この条件に当てはまる用語はありません。</p>`}

  <button class="btn quiet" style="margin-top:16px" data-act="resetAll">記録をすべてリセット</button>
  <p class="foot">記録はこのブラウザの中だけに保存されます。友だちの端末とは別々なので、それぞれの進み具合が残ります。${S.saveOK?"":"<br><b style='color:#B4185C'>※ この環境では保存できないため、ページを閉じると記録が消えます。ダウンロードしたファイルやNetlifyのURLから開けば保存されます。</b>"}</p>`;
}

function vSheet(){
  return `<div class="st"><p class="s">直前</p><h2>要点シート</h2></div>
  ${Object.keys(SHEET).map(k=>{ const n=Number(k), on = S.sheetOpen===n;
    return `<div class="acc"><button data-act="sheet" data-v="${k}">
      <span><span class="xs" style="color:var(--green);font-weight:700">第${k}回</span>
      <span style="display:block;font-family:var(--fd);font-size:14px;font-weight:600;margin-top:2px">${esc(LECTURES[n])}</span></span>
      <span style="color:var(--mute)">${on?"−":"＋"}</span></button>
      ${on?`<div class="body"><ul class="pts">${SHEET[n].map(s=>{const star=s.indexOf("★")===0;
        return `<li><span style="color:${star?'var(--marker)':'var(--mute)'}">${star?"★":"・"}</span><span>${esc(s.replace(/^★/,""))}</span></li>`;}).join("")}</ul></div>`:""}
    </div>`;}).join("")}
  <p class="foot">★ は板書写真に「テスト出る」と書き込みがあった範囲。</p>`;
}

/* ------------------------- render ------------------------- */
function render(){
  $("#tabs").innerHTML = TABS.map(([k,l])=>`<button class="tab ${S.view===k?'on':''}" data-act="go" data-v="${k}">${l}</button>`).join("");
  const v = {home:vHome, terms:vTerms, status:vStatus, essay:vEssay, mock:vMock, sheet:vSheet}[S.view];
  $("#app").innerHTML = v();
}

document.addEventListener("click", (ev)=>{
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if(a==="go"){ S.view=v; if(v!=="essay") S.essay=null; window.scrollTo(0,0); }
  else if(a==="lec"){ S.lec=v; }
  else if(a==="toggle"){ S[v]=!S[v]; }
  else if(a==="dir"){ S.dir=v; }
  else if(a==="start"||a==="retry"){
    const missed = S.deck? S.deck.filter(c=>S.res[c.id]==="ng") : [];
    const base = (a==="retry" && missed.length) ? missed : pool();
    S.deck = shuffle(base).slice(0,20); S.idx=0; S.opened=false; S.res={};
  }
  else if(a==="reset"){ S.deck=null; }
  else if(a==="open"){ S.opened=true; }
  else if(a==="prev"){ if(S.idx>0){ S.idx--; const t=S.deck[S.idx];
    delete S.res[t.id]; delete MASTERY[t.id]; saveMastery(); S.opened=true; window.scrollTo(0,0); } }
  else if(a==="grade"){ const t = S.deck[S.idx]; S.res[t.id]=v; MASTERY[t.id]=v; saveMastery();
    S.opened=false; S.idx++; window.scrollTo(0,0); }
  else if(a==="sfilter"){ S.sFilter=v; S.openTerm=null; }
  else if(a==="slec"){ S.sLec=v; S.openTerm=null; }
  else if(a==="term"){ S.openTerm = S.openTerm===Number(v) ? null : Number(v); }
  else if(a==="mark"){ const [id,st] = v.split(":");
    if(st==="clear") delete MASTERY[Number(id)]; else MASTERY[Number(id)]=st;
    saveMastery(); }
  else if(a==="weak"){
    const weak = statusList().filter(t=>statusOf(t.id)!=="ok");
    if(weak.length){ S.deck = shuffle(weak).slice(0,20); S.idx=0; S.opened=false; S.res={}; S.view="terms"; window.scrollTo(0,0); } }
  else if(a==="resetAll"){
    if(confirm("記録をすべて消して、最初からやり直しますか？")){ MASTERY={}; saveMastery(); } }
  else if(a==="essay"){ S.essay=ESSAYS.find(e=>e.id===v); S.essayText=""; S.essayChecked=false; S.essayOutline=false; window.scrollTo(0,0); }
  else if(a==="essayBack"){ S.essay=null; }
  else if(a==="check"){ S.essayChecked=true; }
  else if(a==="outline"){ S.essayOutline=!S.essayOutline; }
  else if(a==="mockStart"){
    const hot = ESSAYS.filter(e=>e.tag==="exam");
    const rest = shuffle(ESSAYS.filter(e=>e.tag!=="exam"));
    S.mock = { terms: shuffle(pool()).slice(0,20),
               essays: shuffle([hot[Math.floor(Math.random()*hot.length)], ...rest].filter(Boolean).slice(0,3)) };
    S.reveal=false; S.sec=0; startTimer(true); window.scrollTo(0,0);
  }
  else if(a==="pause"){ startTimer(!S.running); }
  else if(a==="reveal"){ S.reveal=!S.reveal; startTimer(false); window.scrollTo(0,0); }
  else if(a==="sheet"){ S.sheetOpen = S.sheetOpen===Number(v)? null : Number(v); }
  render();
});

document.addEventListener("input",(ev)=>{
  if(ev.target.id==="ta"){ S.essayText = ev.target.value;
    const c = $("#cnt"); if(c) c.textContent = S.essayText.replace(/\s/g,"").length; }
});

function startTimer(on){
  S.running = on;
  clearInterval(S.timerId);
  if(on){ S.timerId = setInterval(()=>{ S.sec++;
    const t = $("#timer"); if(t){ t.textContent =
      String(Math.floor(S.sec/60)).padStart(2,"0")+":"+String(S.sec%60).padStart(2,"0"); } },1000); }
}

render();
</script>
</body>
</html>
